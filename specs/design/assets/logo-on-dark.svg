<svg xmlns="http://www.w3.org/2000/svg" width="260" height="64" viewBox="0 0 260 64" role="img" aria-labelledby="title">
  <title id="title">Candidaturas</title>
  <rect width="64" height="64" rx="14" fill="#4f46e5"/>
  <!-- Colunas do kanban (color.primary.hover) -->
  <g fill="#4338ca">
    <rect x="10" y="12" width="12" height="40" rx="4"/>
    <rect x="26" y="12" width="12" height="40" rx="4"/>
    <rect x="42" y="12" width="12" height="40" rx="4"/>
  </g>
  <!-- Cards (color.on.primary) -->
  <g fill="#ffffff">
    <rect x="12" y="14" width="8" height="7" rx="2"/>
    <rect x="12" y="24" width="8" height="7" rx="2"/>
    <rect x="28" y="14" width="8" height="7" rx="2"/>
    <rect x="28" y="24" width="8" height="7" rx="2"/>
    <rect x="28" y="34" width="8" height="7" rx="2"/>
    <rect x="44" y="14" width="8" height="7" rx="2"/>
  </g>
  <!-- Para fundos escuros: texto em branco, font.family.sans semibold. O texto depende da fonte Inter; para uso fora do navegador, converta em contorno. -->
  <text x="80" y="41" fill="#ffffff" font-family="Inter, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="26" font-weight="600">Candidaturas</text>
</svg>
